<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#232323;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#d6d9de;width:900px;height:820px;overflow:hidden;}
  .card{background:#2d2d2d;border:2px solid #1de9b6;border-radius:12px;height:100%;display:flex;flex-direction:column;box-shadow:0 0 22px rgba(29,233,182,.45);padding:12px;}
  .hd{display:flex;align-items:center;border-bottom:1px solid #1de9b6;padding-bottom:10px;}
  .hd h2{font-size:15px;color:#1de9b6;}
  .close{margin-left:auto;background:transparent;border:none;color:#cfd8dc;font-size:16px;cursor:pointer;}
  .info{display:flex;gap:16px;font-size:12px;color:#9aa0a6;margin:10px 0;}
  .info span b{color:#cfd8dc;}
  .chart{flex:1;background:#1a1a1a;border:1px solid #1de9b6;border-radius:8px;margin-bottom:10px;position:relative;}
  .chart h4{position:absolute;top:8px;left:12px;font-size:12px;color:#1de9b6;}
  .chart svg{position:absolute;bottom:0;left:0;width:100%;height:100%;}
  .bar{display:flex;gap:10px;height:180px;}
  .bar .chart{flex:1;}
  .legend{position:absolute;top:8px;right:12px;font-size:11px;color:#9aa0a6;}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px;}
</style></head><body>
<div class="card">
  <div class="hd"><h2>📊 设备性能监控 — MiTV_AZFP0</h2><button class="close">✕</button></div>
  <div class="info"><span>序列号: <b>127.0.0.1:5555</b></span><span>采样间隔: <b>2000 ms</b></span><span>已采样: <b>124 次</b></span></div>
  <div class="chart"><h4>CPU 使用率 (%)</h4><svg preserveAspectRatio="none" viewBox="0 0 860 280"><polyline fill="none" stroke="#1de9b6" stroke-width="2" points="0,220 30,210 60,225 90,200 120,205 150,180 180,170 210,185 240,160 270,165 300,140 330,135 360,150 390,120 420,115 450,130 480,100 510,95 540,110 570,85 600,80 630,90 660,75 690,70 720,60 750,55 780,65 810,50 840,45"/></svg></div>
  <div class="bar">
    <div class="chart"><h4>内存使用 (MB)</h4><svg preserveAspectRatio="none" viewBox="0 0 420 150"><polyline fill="rgba(29,233,182,.15)" stroke="#1de9b6" stroke-width="2" points="0,120 30,115 60,110 90,112 120,105 150,100 180,95 210,90 240,85 270,80 300,75 330,70 360,65 390,60 420,55"/></svg></div>
    <div class="chart"><h4>GPU 使用率 (%)</h4><svg preserveAspectRatio="none" viewBox="0 0 420 150"><polyline fill="none" stroke="#f5c542" stroke-width="2" points="0,130 30,125 60,120 90,115 120,118 150,110 180,105 210,100 240,95 270,90 300,85 330,80 360,75 390,70 420,65"/></svg></div>
  </div>
  <div class="info"><span>当前 CPU: <b>12.3%</b></span><span>内存: <b>2140 / 6144 MB</b></span><span>GPU: <b>8.1%</b></span><span>电池: <b>87%</b></span></div>
</div></body></html>
