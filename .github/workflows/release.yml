name: Release

# Installers are NOT committed to the repository.
# Push a tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) and this workflow
# builds macOS / Windows / Linux bundles and attaches them to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .app + zip
        env:
          SUPER_ADB_PYTHON: ${{ steps.python.outputs.python-path }}
        working-directory: Super_ADB_MAC
        run: bash build_tools/build_mac_zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Super_ADB-macos
          path: Super_ADB_MAC/build_tools/dist/Super_ADB_mac.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        working-directory: Super_ADB_Win
        run: pyinstaller --noconfirm --clean build_tools/Super_ADB.spec

      - name: Zip bundle
        working-directory: Super_ADB_Win/build_tools/dist
        run: Compress-Archive -Path Super_ADB -DestinationPath Super_ADB_win64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Super_ADB-windows
          path: Super_ADB_Win/build_tools/dist/Super_ADB_win64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Super_ADB_Linux/build_tools/requirements_linux.txt

      - name: Build bundle + tarball
        working-directory: Super_ADB_Linux
        run: bash build_tools/build_linux.sh --clean --archive

      - uses: actions/upload-artifact@v4
        with:
          name: Super_ADB-linux
          path: Super_ADB_Linux/build_tools/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
