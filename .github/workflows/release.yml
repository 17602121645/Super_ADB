name: Release

# 安装包不入库。打 tag（如 `git tag v1.2.0 && git push origin v1.2.0`）后，
# 本工作流构建 macOS arm64 / Windows x64 / Linux x86_64 三份产物并挂到 GitHub Release，
# 并把 Windows / macOS 包同步上传到 Gitee「发行版」（Linux 包由 Gitee 仓库的 Gitee Go 流水线负责）。
#
# 触发方式（任意一种都会自动打包含）：
#   1. git push origin vX.Y.Z          —— 推荐，全自动建 Release + 上传包
#   2. GitHub 网页上点"发布 Release"    —— 兼容手动发版，CI 补传构建包
#   3. Actions 页面手动 workflow_dispatch —— 调试用
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 与 ci.yml 共用同一个可复用工作流，保证「CI 能构建」等价于「发版能构建」
  build:
    uses: ./.github/workflows/build.yml
    # 若已按下方说明给 build.yml 加了 ref 输入，取消注释以确保
    # release 事件触发时检出的是 tag 对应代码，而非默认分支最新 commit。
    # with:
    #   ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # push tags 时 github.ref = refs/tags/vX；release 事件时走 event_name 判断
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      # 统一解析 tag 名：push tags 从 github.ref 取，release 事件从 event 取，
      # 供 softprops/action-gh-release 精确定位到目标 Release（避免误建新 Release）。
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false

      # Gitee「发行版」由本工作流统一上传三平台包（Linux tar.gz + Windows zip + macOS zip），
      # Gitee 侧不再自行打包，幂等可重跑。
      # 前置：GitHub 仓库 Settings -> Secrets -> Actions 添加 GITEE_TOKEN（Gitee 私人令牌，
      # 勾选 projects 权限）；Gitee 仓库需已推送同名 tag。
      - name: Upload artifacts to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: Jcs2026
          GITEE_REPO: super_adb
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::未配置 GITEE_TOKEN（Gitee 私人令牌），跳过同步到 Gitee 发行版"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          # 1) 幂等查找同名 tag 的 Gitee 发行版，不存在则创建
          EXIST=$(curl -s "${API}/releases?per_page=100&access_token=${GITEE_TOKEN}" || echo "[]")
          RID=$(echo "${EXIST}" | python -c "import json,sys,os; data=json.load(sys.stdin); tag=os.environ.get('TAG',''); print(next((str(r['id']) for r in data if r.get('tag_name')==tag), ''))")
          if [ -z "${RID}" ]; then
            echo "==> 创建 Gitee 发行版 ${TAG}"
            RESP=$(curl -s -X POST "${API}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Super_ADB ${TAG} 发布包（GitHub Actions 自动发布）\",\"target_commitish\":\"master\",\"prerelease\":false}")
            RID=$(echo "${RESP}" | python -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          fi
          test -n "${RID}" || { echo "::error::无法定位/创建 Gitee 发行版"; exit 1; }
          echo "==> Gitee release id=${RID}"
          # 2) 上传三平台包（已存在同名附件则跳过，幂等重跑）
          for f in artifacts/Super_ADB-*; do
            [ -e "${f}" ] || continue
            base=$(basename "${f}")
            EXIST_ATT=$(curl -s "${API}/releases/${RID}/attach_files?per_page=100&access_token=${GITEE_TOKEN}" || echo "[]")
            if echo "${EXIST_ATT}" | python -c "import json,sys; data=json.load(sys.stdin); names=[a.get('name','') for a in data]; sys.exit(0 if '${base}' in names else 1)" 2>/dev/null; then
              echo "==> 已存在附件 ${base}，跳过"
              continue
            fi
            echo "==> 上传 ${base} -> release ${RID}"
            curl -s -X POST "${API}/releases/${RID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" >/dev/null
            echo "    done"
          done
